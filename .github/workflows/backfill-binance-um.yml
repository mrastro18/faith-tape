name: backfill-binance-um

# One-off history from Binance's public USD-M futures archive (data.binance.vision): five-minute perp candles,
# funding and five-minute open interest with long/short ratios, 2021-01 to 2025-12 (recorder/backfill-binance-um.mjs).
# Research data only, as signals for US-spot research: no account, no key, no trading. Started by hand only. 2026 is
# FAITH's holdout and is refused by the script. Each symbol and kind is committed as soon as it is done, and a file
# already on disk is skipped, so a run cut off by its time limit resumes where it stopped when started again.
on:
  workflow_dispatch:
    inputs:
      syms:
        description: "Comma-separated symbols"
        default: "BTCUSDT,ETHUSDT,SOLUSDT,DOGEUSDT"
      kinds:
        description: "Comma-separated kinds: klines, funding, metrics"
        default: "klines,funding,metrics"
      metrics_from:
        description: "First month of metrics (YYYY-MM)"
        default: "2021-01"
      metrics_cols:
        description: "Metrics columns: full (open interest and ratios) or oi (open interest only)"
        default: "full"

concurrency:
  group: backfill-binance-um
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Tests
        run: node --test test/backfill-binance-um.test.mjs
      - name: Fetch and commit, one symbol and kind at a time
        env:
          SYMS: ${{ inputs.syms }}
          KINDS: ${{ inputs.kinds }}
          METRICS_FROM: ${{ inputs.metrics_from }}
          METRICS_COLS: ${{ inputs.metrics_cols }}
        run: |
          git config user.name "faith-tape recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          for s in ${SYMS//,/ }; do
            for k in ${KINDS//,/ }; do
              node recorder/backfill-binance-um.mjs . --syms "$s" --kinds "$k" --metrics-from "$METRICS_FROM" --metrics-cols "$METRICS_COLS" || status=1
              git add data/binance-um
              if git diff --cached --quiet; then continue; fi
              git commit -q -m "history: binance-um ${k} ${s} run ${GITHUB_RUN_ID}"
              pushed=0
              for i in 1 2 3 4; do
                if git push -q origin HEAD:main; then pushed=1; break; fi
                git pull -q --rebase --depth=20 origin main || { git rebase --abort; exit 1; }
                sleep $((i * 5))
              done
              if [ "$pushed" -ne 1 ]; then echo "push failed for ${k} ${s}"; status=1; fi
            done
          done
          du -sh data/binance-um/* || true
          exit $status
