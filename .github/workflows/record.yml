name: record

# Half-hourly recorder of public market data. No secrets: it reads documented public endpoints and commits
# what it read to this repository with the job's own short-lived token. A push of recorder code also
# starts a run, so a fix is tested on real venues at once. Commits made by this job start no run.
# GitHub's schedule alone is not enough: it fired once in the first 13 hours. So each run ends by waiting
# for the next slot (minute 7 or 37) and starting the next run itself. A start made with the job's token
# is one of the two events GitHub lets such a token trigger. If two chains ever run, the concurrency group
# keeps one run and one pending, and a newer pending run replaces the older, so they fold back into one.
on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes, at minutes 7 and 37 (UTC)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["recorder/**", "test/**", ".github/workflows/record.yml"]

concurrency:
  group: record
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # only for the next job's start of the next run

jobs:
  record:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # a queued run records from the newest state, not from the commit that queued it
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Recorder tests
        run: node --test test/*.test.mjs
      - name: Record
        run: node recorder/record.mjs .
      # FAITH P-OF3 q2 forward check: whole days of Coinbase five-minute candles from 2026-11-01 (after the
      # holdout), skipped when already on disk. A failure here must not stop the recorder's own commit.
      - name: Forward candles
        continue-on-error: true
        timeout-minutes: 3
        run: node recorder/forward.mjs .
      # One-second bars leave git for a release asset (tape-<day>); only a manifest line is committed. A failure
      # leaves the files in place, and the next step commits them to git as before (CHANGES 2026-11-12).
      - name: Offload bars
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: node recorder/offload.mjs . --kind bars --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Commit data
        run: |
          git config user.name "faith-tape recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if [ -d manifests ]; then git add manifests; fi
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "tape: $(date -u +%Y-%m-%dT%H:%MZ) run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            git fetch -q --depth=20 origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1

  next:
    needs: record
    if: always() # a failed record must not stop the chain
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Work out the next slot (minute 7 or 37)
        id: slot
        run: |
          now=$(date -u +%s)
          min=$(( (now / 60) % 60 ))
          sec=$(( now % 60 ))
          if [ "$min" -lt 7 ]; then wait=$(( (7 - min) * 60 - sec ))
          elif [ "$min" -lt 37 ]; then wait=$(( (37 - min) * 60 - sec ))
          else wait=$(( (67 - min) * 60 - sec )); fi
          echo "at=$(( now + wait ))" >> "$GITHUB_OUTPUT"
          echo "next run in ${wait}s"
      # The wait would otherwise be idle: poll best bid and ask (Binance.US, Coinbase, Kraken) until a minute before the slot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: "22"
      # Four minutes before the slot, start the bridge workflow, which polls across the handover until five
      # minutes after it (bridge.yml). Its start failing costs only the bridge, never this session.
      - name: Poll quotes
        continue-on-error: true
        timeout-minutes: 32
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          at=${{ steps.slot.outputs.at }}
          d=$(( at - 240 - $(date -u +%s) ))
          if [ "$d" -gt 0 ]; then
            ( sleep "$d"; gh workflow run bridge.yml --ref main -f until="$(( (at + 300) * 1000 ))" || echo "bridge start failed" ) &
          fi
          node recorder/quotes.mjs . --until "$(( (at - 60) * 1000 ))"
      # The session's quote files leave git the same way; on failure they are committed as before.
      - name: Offload quotes
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: node recorder/offload.mjs . --kind quotes --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      # The size stream (data/<venue>/quotesz/, CHANGES 2026-11-12e) after the quotes, as its own bundle and line.
      - name: Offload quote sizes
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: node recorder/offload.mjs . --kind quotesz --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Commit quotes
        continue-on-error: true
        timeout-minutes: 3
        run: |
          git config user.name "faith-tape recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a venue that never answered this session has no directory yet, and git add fails on a missing path
          for d in data/binanceus/quotes data/coinbase/quotes data/kraken/quotes data/binanceus/quotesz data/coinbase/quotesz data/kraken/quotesz manifests; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "quotes: $(date -u +%Y-%m-%dT%H:%MZ) run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            git fetch -q --depth=20 origin main
            git rebase -q origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
      - name: Wait for the slot, then start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wait=$(( ${{ steps.slot.outputs.at }} - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run record.yml --ref main
